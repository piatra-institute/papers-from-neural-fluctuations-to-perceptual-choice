- id: int-std
  kind: interpretation
  passage: For a bounded accumulator the choice probability depends on diffusion, mobility and bound only through
    $D/(MB)$, a standard first-passage result [@palmer2005; @redner2001; @risken1989].
  rationale: Standard first-passage result (Proposition 1, proved in the text).
- id: p1
  kind: interpretation
  passage: '*Proof.* The exit probability $u(x)$ through $+B$ from a start $x$ solves $D u'''' + Mh\,u'' = 0$ with
    $u(-B) = 0$ and $u(B) = 1$, so $u(x) = (1 - e^{-Mh(x+B)/D})/(1 - e^{-2MhB/D})$.'
  rationale: Proposition 1 proved in the text; Monte Carlo agreement (/theory/ddm/max_abs_zscore below 3.5; /checks/exit_probabilities_match_closed_form).
- id: p2
  kind: interpretation
  passage: '*Proof.* Per new unit of time the drift of $A$ is $a\kappa Mh$ and its diffusion $a^2\kappa D$, and
    the bound sits at distance $|a|B$ from the start, so $D/(MB)$ is multiplied by $a^2\kappa/(a\kappa|a|) = \pm
    1$, the sign recording a relabelling of the choices.'
  rationale: Proposition 2 proved in the text; numerical check /theory/invariance and /checks/rescaling_leaves_theta_and_choice_unchanged.
- id: p3
  kind: interpretation
  passage: '*Proof.* (a) With the scale density $\exp(-(vy - \lambda y^2/2)/D)$, the exit probability from 0 is
    the integral of the density over $(-B, 0)$ divided by its integral over $(-B, B)$.'
  rationale: Proposition 3 proved in the text; checks against quadrature and Monte Carlo (/theory/leak, /theory/drift_var,
    /theory/start_var, /theory/start_bias).
