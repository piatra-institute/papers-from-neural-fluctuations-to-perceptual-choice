web_blurb: For a decision variable that accumulates evidence to a bound, the psychometric slope equals
  mobility times bound over diffusion, a ratio that survives any affine rescaling of a neural decoder.
  Optional-stopping estimators recover diffusion and mobility from spiking populations without choices
  and predict the slope fitted to choices; naive estimators fail by large factors, the prediction tracks
  behaviour under leak, instability and drift variability, and urgency or a choice-irrelevant signal on
  the coding axis open gaps of about 10%.
